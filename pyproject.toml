[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon-seated-xr"
version = "1.0.0"
description = "Horizon Seated XR Ergonomics Validator & Quest 3 Frame Budget Profiler"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Kazutoshi Hayashi (LUMA LAB)"}]
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
